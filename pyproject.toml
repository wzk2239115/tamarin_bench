[project]
name = "tamaringym"
version = "0.1.0"
description = "A benchmark for evaluating AI agents on security protocol verification with Tamarin"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
authors = [
    { name = "tamarin_bench contributors" },
]

dependencies = [
    "pydantic>=2.12.5",
    "docker>=7.1.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.33.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.28.1",
    "tqdm>=4.67.1",
    "jinja2>=3.1.0",
    "litellm[proxy]>=1.98.0",
    "prisma>=0.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff==0.15.8",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.optional-dependencies]
proxy = [
    "litellm[proxy]>=1.86",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tamaringym"]

[tool.ruff]
line-length = 88

lint.select = ["I", "F"]
lint.ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"test_*.py" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
